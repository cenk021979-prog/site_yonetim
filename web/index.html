    (function () {

      if (!boot) return;
      var done = false;
      function hide() {
        if (done) return;
        done = true;
        boot.style.opacity = '0';
        setTimeout(function () { boot.remove(); }, 600);
      }
      window.addEventListener('flutter-first-frame', hide);

      setTimeout(hide, 45000);
    })();

          if (toPill && pill && (isAndroid || isIos || isWindows)) {
            if (!sessionStorage.getItem('pill_dismissed_session')) {
              pill.style.display = 'flex';
            }
          }
        }, 350);
        sessionStorage.setItem('banner_dismissed_session', '1');
      }

      if (dismissBtn) {
        dismissBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          hideBanner(true);
        });
      }

      if (pillDismissBtn) {
        pillDismissBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          e.preventDefault();
          if (pill) pill.style.display = 'none';
          sessionStorage.setItem('pill_dismissed_session', '1');
        });
      }

      if (pillBodyBtn) {
        pillBodyBtn.addEventListener('click', function (e) {
          if (pillMover && pillMover.isDragging()) return;
          if (isAndroid) {
            triggerApkDownload();
            showBanner();
          } else if (isWindows) {
            triggerWindowsDownload();
            showBanner();
          } else {
            showBanner();
          }
        });
      }

      function triggerApkDownload() {
        if (descEl) {
          descEl.textContent = 'İndirme başladı! İndirilen APK dosyasını açıp Kur / Yükle diyerek yükleyebilirsiniz.';
        }
        if (installBtn) {
          installBtn.textContent = 'Tekrar İndir';
        }
        // Doğrudan APK dosyasını tarayıcıdan indir
        var link = document.createElement('a');
        link.href = '/site_yonetim.apk';
        link.download = 'site_yonetim.apk';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      function triggerWindowsDownload() {
        if (descEl) {
          descEl.textContent = 'İndirme başladı! İndirilen ZIP dosyasını klasöre çıkarıp uygulamayı çalıştırabilirsiniz.';
        }
        if (installBtn) {
          installBtn.textContent = 'Tekrar İndir';
        }
        var link = document.createElement('a');
        link.href = '/download/windows';
        link.download = 'site_yonetim_windows.zip';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      if (winBtn) {
        winBtn.onclick = triggerWindowsDownload;
      }

      if (isWindows) {
        if (titleEl) titleEl.textContent = 'Site Yönetim';
        if (descEl) descEl.textContent = 'Android APK ve Windows uygulamasını doğrudan indirin.';
        if (installBtn) {
          installBtn.textContent = 'APK İndir';
          installBtn.onclick = triggerApkDownload;
        }
        if (winBtn) {
          winBtn.style.display = 'inline-block';
        }
        if (pillLabel) {
          pillLabel.textContent = 'Android APK İndir';
        }
        setTimeout(function () {
          if (!sessionStorage.getItem('banner_dismissed_session')) {
            showBanner();
          } else if (pill && !sessionStorage.getItem('pill_dismissed_session')) {
            pill.style.display = 'flex';
          }
        }, 1000);
      } else if (isAndroid) {
        if (titleEl) titleEl.textContent = 'Site Yönetim (Android)';
        if (descEl) descEl.textContent = 'Resmi Android uygulamasını (.APK) doğrudan telefonunuza indirin.';
        if (installBtn) {
          installBtn.textContent = 'APK İndir';
          installBtn.onclick = triggerApkDownload;
        }
        if (pillLabel) {
          pillLabel.textContent = 'Android APK İndir';
        }
        setTimeout(function () {
          if (!sessionStorage.getItem('banner_dismissed_session')) {
            showBanner();
          } else if (pill && !sessionStorage.getItem('pill_dismissed_session')) {
            pill.style.display = 'flex';
          }
        }, 1200);
      } else if (isIos) {
        if (titleEl) titleEl.textContent = 'Site Yönetim (iOS)';
        if (IOS_APP_STORE_URL && IOS_APP_STORE_URL.length > 5) {
          if (descEl) descEl.textContent = 'App Store üzerinden resmi iOS uygulamasını indirin.';
          if (installBtn) {
            installBtn.textContent = 'App Store';
            installBtn.onclick = function () { window.location.href = IOS_APP_STORE_URL; };
          }
        } else {
          if (descEl) {
            descEl.innerHTML = 'Safari alttaki <strong>Paylaş</strong> simgesine dokunup <strong>"Ana Ekrana Ekle"</strong>yi seçin.';
          }
          if (installBtn) {
            installBtn.style.display = 'none';
          }
        }
        if (pillLabel) {
          pillLabel.textContent = 'iOS Kurulumu';
        }
        setTimeout(function () {
          if (!sessionStorage.getItem('banner_dismissed_session')) {
            showBanner();
          } else if (pill && !sessionStorage.getItem('pill_dismissed_session')) {
            pill.style.display = 'flex';
          }
        }, 1500);
      } else {
        // Masaüstü / Diğer ortamlar: İsteğe bağlı APK indirme butonu
        if (titleEl) titleEl.textContent = 'Site Yönetim';
        if (descEl) descEl.textContent = 'Android cihazlar için resmi .APK dosyasını indirin.';
        if (installBtn) {
          installBtn.textContent = 'APK İndir';
          installBtn.onclick = triggerApkDownload;
        }
      }
    })();
  </script>
</body>
</html>
